<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fahxd Core</title>
  <link rel="icon" href="/fahad-core-mark.svg" />

  <!-- PWA Meta Tags -->
  <meta name="theme-color" content="#b9553b" />
  <meta name="description" content="Fahxd Core - Your AI-powered chatbot assistant" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Fahxd" />
  <link rel="apple-touch-icon" href="/icons/icon-192x192.png" />
  <link rel="manifest" href="/manifest.json" />
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f4ed;
      --sidebar: #eee9df;
      --sidebar-line: #ded7ca;
      --card: #fffdf8;
      --ink: #171512;
      --muted: #6f675d;
      --accent: #d97355;
      --accent-dark: #b9553b;
      --line: #e3dacc;
      --shadow: 0 20px 45px rgba(62, 45, 28, 0.12);
      --sidebar-width: 390px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
    }

    body {
      margin: 0;
      min-width: 320px;
      overflow: hidden;
      color: var(--ink);
      background: var(--bg);
      font-family:
        Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button,
    select {
      cursor: pointer;
    }

    button {
      border: 0;
    }

    .app {
      display: grid;
      grid-template-columns: var(--sidebar-width) minmax(0, 1fr);
      height: 100vh;
      background: var(--bg);
    }

    .sidebar {
      display: grid;
      grid-template-rows: auto auto auto minmax(0, 1fr) auto;
      gap: 20px;
      min-width: 0;
      padding: 27px 21px 18px;
      background: var(--sidebar);
      border-right: 1px solid var(--sidebar-line);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 48px;
      color: var(--accent-dark);
      font-size: 22px;
      font-weight: 750;
    }

    .brand-mark {
      display: grid;
      width: 40px;
      height: 40px;
      place-items: center;
      color: #fff;
      background: var(--accent);
      border-radius: 12px;
    }

    .brand-mark svg,
    .icon svg,
    .icon-button svg {
      width: 22px;
      height: 22px;
      stroke: currentColor;
      stroke-width: 2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .new-chat {
      display: flex;
      align-items: center;
      gap: 13px;
      width: 100%;
      min-height: 57px;
      padding: 0 21px;
      color: #fff;
      background: var(--accent);
      border-radius: 12px;
      font-size: 20px;
      font-weight: 730;
      text-align: left;
      transition:
        transform 160ms ease,
        background 160ms ease;
    }

    .new-chat:hover {
      transform: translateY(-1px);
      background: var(--accent-dark);
    }

    .search {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 44px;
      padding: 0 14px;
      color: var(--muted);
      background: transparent;
    }

    .search input {
      width: 100%;
      min-width: 0;
      color: var(--ink);
      font-size: 19px;
      background: transparent;
      border: 0;
      outline: 0;
    }

    .search input::placeholder {
      color: var(--muted);
      opacity: 1;
    }

    .section-title {
      margin: 4px 0 18px 6px;
      color: var(--muted);
      font-size: 16px;
      font-weight: 650;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .recent {
      min-height: 0;
      overflow: auto;
      padding-right: 4px;
    }

    .chat-list {
      display: grid;
      gap: 2px;
    }

    .chat-row {
      display: grid;
      grid-template-columns: 26px minmax(0, 1fr) 32px;
      align-items: center;
      gap: 11px;
      min-height: 53px;
      padding: 0 6px;
      color: var(--ink);
      background: transparent;
      border-radius: 9px;
      text-align: left;
    }

    .chat-row:hover,
    .chat-row.active {
      background: rgba(255, 253, 248, 0.65);
    }

    .chat-row-title {
      overflow: hidden;
      font-size: 20px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .delete-chat {
      display: none;
      width: 30px;
      height: 30px;
      place-items: center;
      color: var(--muted);
      background: transparent;
      border-radius: 7px;
    }

    .chat-row:hover .delete-chat {
      display: grid;
    }

    .empty-recent {
      padding: 12px 7px;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.45;
    }

    .account {
      display: grid;
      grid-template-columns: 43px minmax(0, 1fr) 34px;
      align-items: center;
      gap: 12px;
      min-height: 58px;
      margin: 0 -21px -18px;
      padding: 14px 20px 17px;
      border-top: 1px solid var(--sidebar-line);
    }

    .avatar {
      display: grid;
      width: 40px;
      height: 40px;
      place-items: center;
      color: var(--accent-dark);
      background: #f7dbc9;
      border-radius: 50%;
      font-weight: 760;
    }

    .account-name {
      overflow: hidden;
      font-size: 19px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .account {
      cursor: pointer;
    }

    .modal-overlay {
      display: grid;
      position: fixed;
      inset: 0;
      z-index: 60;
      place-items: center;
      padding: 20px;
      background: rgba(23, 21, 18, 0.45);
    }

    .modal-overlay[hidden] {
      display: none;
    }

    .modal-card {
      display: grid;
      width: min(420px, 100%);
      gap: 18px;
      padding: 24px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 20px;
      box-shadow: var(--shadow);
    }

    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .modal-head h2 {
      margin: 0;
      color: var(--accent-dark);
      font-size: 21px;
    }

    .modal-field {
      display: grid;
      gap: 7px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 650;
    }

    .modal-field input {
      min-height: 46px;
      padding: 0 14px;
      color: var(--ink);
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 11px;
      font-size: 16px;
    }

    .modal-field input:focus {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
    }

    .modal-static {
      min-height: 46px;
      display: flex;
      align-items: center;
      padding: 0 14px;
      color: var(--ink);
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 11px;
      font-size: 16px;
      font-weight: 600;
    }

    .modal-danger {
      min-height: 46px;
      color: #b9553b;
      background: #fff1e8;
      border: 1px solid #efc8b7;
      border-radius: 11px;
      font-size: 15px;
      font-weight: 700;
    }

    .modal-danger:hover {
      background: #ffe4d5;
    }

    .icon-button {
      display: grid;
      width: 42px;
      height: 42px;
      place-items: center;
      color: var(--muted);
      background: transparent;
      border-radius: 9px;
    }

    .icon-button:hover {
      background: rgba(0, 0, 0, 0.05);
    }

    .main {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      min-width: 0;
      min-height: 0;
      background: var(--bg);
    }

    .topbar {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 18px;
      height: 88px;
      padding: 0 38px;
    }

    .close-sidebar {
      display: none;
    }

    .model-select {
      display: inline-grid;
      grid-template-columns: auto 20px;
      align-items: center;
      gap: 7px;
      min-height: 44px;
      color: var(--ink);
    }

    .model-select select {
      max-width: 220px;
      min-height: 44px;
      padding: 0 4px 0 0;
      color: var(--ink);
      background: transparent;
      border: 0;
      outline: 0;
      appearance: none;
      font-size: 17px;
      font-weight: 550;
    }

    .topbar-right {
      justify-self: end;
      display: inline-flex;
      align-items: center;
      gap: 16px;
    }

    .topbar-brand {
      justify-self: start;
      display: inline-flex;
      font-size: 30px;
      font-weight: 900;
      letter-spacing: 0;
      font-variant-ligatures: none;
    }

    .brand-fahxd {
      color: var(--accent-dark);
    }

    .brand-core {
      color: var(--accent);
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 36px;
      padding: 0 12px;
      color: var(--muted);
      background: rgba(255, 253, 248, 0.72);
      border: 1px solid var(--line);
      border-radius: 999px;
      font-size: 14px;
      font-weight: 650;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background: #4b9f6f;
      border-radius: 50%;
    }

    .mobile-menu {
      display: none;
    }

    .content {
      min-width: 0;
      min-height: 0;
      overflow: auto;
    }

    .server-warning {
      display: none;
      width: min(1020px, calc(100% - 52px));
      margin: 0 auto 18px;
      padding: 14px 16px;
      color: var(--accent-dark);
      background: #fff1e8;
      border: 1px solid #efc8b7;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 650;
      line-height: 1.45;
    }

    body.file-mode .server-warning {
      display: block;
    }

    .welcome {
      display: flex;
      flex-direction: column;
      width: min(1020px, calc(100% - 52px));
      height: 100%;
      margin: 0 auto;
      padding: 96px 0 28px;
    }

    .welcome-scroll {
      min-height: 0;
      overflow-y: auto;
    }

    .welcome-mark {
      display: grid;
      width: 60px;
      height: 60px;
      place-items: center;
      margin-bottom: 35px;
      color: var(--accent-dark);
      background: #f4dac9;
      border-radius: 18px;
    }

    .welcome h1 {
      margin: 0 0 18px;
      color: var(--accent-dark);
      font-size: clamp(40px, 5vw, 47px);
      line-height: 1;
      letter-spacing: 0;
    }

    .welcome p {
      margin: 0 0 42px;
      color: var(--muted);
      font-size: clamp(20px, 2.3vw, 24px);
    }

    .prompt-box {
      display: block;
      flex: none;
      margin-top: auto;
      padding-top: 24px;
    }

    .prompt-pill {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto auto;
      align-items: center;
      gap: 8px;
      min-height: 58px;
      padding: 6px 8px 6px 8px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 999px;
      box-shadow: var(--shadow);
    }

    .prompt-pill textarea {
      width: 100%;
      min-height: 26px;
      max-height: 120px;
      padding: 8px 2px;
      resize: none;
      overflow: hidden;
      color: var(--ink);
      background: transparent;
      border: 0;
      outline: 0;
      font-size: 17px;
      line-height: 1.4;
    }

    .prompt-pill textarea::placeholder {
      color: #625f5a;
      opacity: 1;
    }

    .prompt-pill .attach-button,
    .prompt-pill .voice-button,
    .prompt-pill .send-button {
      width: 42px;
      height: 42px;
    }

    .file-chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      max-width: 100%;
      margin-bottom: 10px;
      padding: 7px 10px;
      color: var(--accent-dark);
      background: #fff1e8;
      border: 1px solid #efc8b7;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 650;
    }

    .file-chip[hidden] {
      display: none;
    }

    .file-chip svg {
      flex: none;
      stroke: currentColor;
      stroke-width: 2;
      fill: none;
    }

    .file-chip-name {
      overflow: hidden;
      max-width: 260px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .file-chip-remove {
      display: grid;
      flex: none;
      width: 18px;
      height: 18px;
      place-items: center;
      color: var(--accent-dark);
      background: transparent;
      border-radius: 50%;
      font-size: 16px;
      line-height: 1;
    }

    .file-chip-remove:hover {
      background: rgba(185, 85, 59, 0.15);
    }

    #chatFileChip {
      margin: 0 0 8px 4px;
    }

    .message-file-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 8px;
      padding: 5px 9px;
      color: var(--accent-dark);
      background: #fff1e8;
      border: 1px solid #efc8b7;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 650;
    }

    .message-file-chip svg {
      flex: none;
      stroke: currentColor;
      fill: none;
    }

    .attach-button,
    .voice-button,
    .send-button,
    .stop-button {
      display: grid;
      place-items: center;
      border-radius: 13px;
    }

    .attach-button,
    .voice-button {
      justify-self: start;
      width: 42px;
      height: 42px;
      color: var(--muted);
      background: transparent;
    }

    .voice-button.listening {
      color: #fff;
      background: var(--accent);
      box-shadow: 0 0 0 6px rgba(217, 115, 85, 0.18);
    }

    .send-button {
      width: 51px;
      height: 51px;
      color: var(--muted);
      background: #e7dfd2;
    }

    .send-button.ready {
      color: #fff;
      background: var(--accent);
    }

    .send-button:disabled {
      cursor: not-allowed;
      opacity: 0.55;
    }

    .stop-button:disabled {
      display: none;
    }

    .suggestions {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 15px;
      margin-top: 28px;
    }

    .suggestions button {
      min-height: 69px;
      padding: 0 22px;
      overflow: hidden;
      color: var(--ink);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      font-size: 20px;
      text-align: left;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .suggestions button:hover {
      border-color: #cfc3b3;
      box-shadow: 0 10px 25px rgba(62, 45, 28, 0.08);
    }

    .thread {
      display: none;
      grid-template-rows: minmax(0, 1fr) auto;
      min-height: calc(100vh - 88px);
    }

    .thread.active {
      display: grid;
    }

    .messages {
      display: flex;
      flex-direction: column;
      gap: 24px;
      width: min(960px, calc(100% - 48px));
      margin: 0 auto;
      padding: 24px 0 28px;
      overflow: auto;
    }

    .message {
      display: grid;
      grid-template-columns: 40px minmax(0, 1fr);
      gap: 14px;
      align-items: start;
    }

    .message.user {
      grid-template-columns: minmax(0, 1fr) 40px;
    }

    .message-avatar {
      display: grid;
      width: 40px;
      height: 40px;
      place-items: center;
      color: #fff;
      background: var(--accent);
      border-radius: 12px;
      font-size: 13px;
      font-weight: 800;
    }

    .message-avatar-brain {
      background: #f4dac9;
    }

    .message.user .message-avatar {
      grid-column: 2;
      background: #2b2925;
    }

    .bubble {
      min-width: 0;
      padding: 16px 18px;
      color: var(--ink);
      background: transparent;
      border-radius: 14px;
      font-size: 18px;
      line-height: 1.65;
    }

    .message.user .bubble {
      grid-column: 1;
      grid-row: 1;
      justify-self: end;
      max-width: min(760px, 100%);
      background: var(--card);
      border: 1px solid var(--line);
    }

    .bubble p {
      margin: 0 0 0.8rem;
    }

    .bubble p:last-child {
      margin-bottom: 0;
    }

    .bubble pre {
      overflow: auto;
      margin: 0.9rem 0;
      padding: 14px;
      color: #f8f3e8;
      background: #1c1a17;
      border-radius: 10px;
    }

    .bubble code {
      padding: 0.14rem 0.34rem;
      background: #eee5d8;
      border-radius: 5px;
    }

    .bubble pre code {
      padding: 0;
      color: inherit;
      background: transparent;
    }

    .answer-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
    }

    .copy-answer,
    .listen-answer {
      margin-top: 8px;
      padding: 7px 10px;
      color: var(--muted);
      background: transparent;
      border-radius: 8px;
      font-size: 14px;
    }

    .copy-answer:hover,
    .listen-answer:hover,
    .listen-answer.playing {
      background: rgba(0, 0, 0, 0.05);
    }

    .typing {
      display: inline-flex;
      gap: 6px;
      align-items: center;
      min-height: 30px;
    }

    .typing span {
      width: 7px;
      height: 7px;
      background: var(--accent);
      border-radius: 50%;
      animation: pulse 1s infinite ease-in-out;
    }

    .typing span:nth-child(2) {
      animation-delay: 140ms;
    }

    .typing span:nth-child(3) {
      animation-delay: 280ms;
    }

    @keyframes pulse {

      0%,
      85%,
      100% {
        opacity: 0.25;
        transform: translateY(0);
      }

      45% {
        opacity: 1;
        transform: translateY(-3px);
      }
    }

    .composer-wrap {
      width: min(960px, calc(100% - 48px));
      margin: 0 auto;
      padding: 0 0 24px;
    }

    .compact-composer {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto auto auto;
      align-items: end;
      gap: 10px;
      min-height: 70px;
      padding: 10px 12px 10px 18px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: var(--shadow);
    }

    .compact-composer textarea {
      width: 100%;
      min-height: 46px;
      max-height: 150px;
      padding: 10px 0;
      resize: none;
      color: var(--ink);
      background: transparent;
      border: 0;
      outline: 0;
      font-size: 18px;
      line-height: 1.45;
    }

    .stop-button {
      min-width: 64px;
      height: 46px;
      color: var(--accent-dark);
      background: #f4dac9;
      font-weight: 700;
    }

    .overlay {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: none;
      background: rgba(23, 21, 18, 0.34);
    }

    @media (max-width: 980px) {
      body {
        overflow: auto;
      }

      .app {
        grid-template-columns: 1fr;
        min-height: 100vh;
      }

      .sidebar {
        position: fixed;
        inset: 0 auto 0 0;
        z-index: 30;
        width: min(390px, calc(100vw - 34px));
        height: 100vh;
        transform: translateX(-105%);
        transition: transform 180ms ease;
      }

      body.sidebar-open .sidebar {
        transform: translateX(0);
      }

      body.sidebar-open .overlay {
        display: block;
      }

      .topbar {
        grid-template-columns: auto 1fr auto;
        height: 72px;
        padding: 0 16px;
      }

      .mobile-menu {
        display: grid;
      }

      .close-sidebar {
        display: grid;
        margin-left: auto;
      }

      .brand {
        display: grid;
        grid-template-columns: 40px minmax(0, 1fr) auto;
      }

      .welcome {
        width: min(720px, calc(100% - 28px));
        padding-top: 56px;
      }

      .thread {
        min-height: calc(100vh - 72px);
      }
    }

    @media (max-width: 640px) {
      .welcome {
        padding-top: 32px;
      }

      .welcome-mark {
        margin-bottom: 22px;
      }

      .prompt-pill {
        min-height: 52px;
        padding: 4px 6px;
      }

      .prompt-pill textarea {
        font-size: 16px;
      }

      .prompt-pill .attach-button,
      .prompt-pill .voice-button,
      .prompt-pill .send-button {
        width: 38px;
        height: 38px;
      }

      .suggestions {
        grid-template-columns: 1fr;
        gap: 10px;
      }

      .suggestions button {
        min-height: 58px;
        font-size: 17px;
      }

      .status-pill {
        display: none;
      }

      .topbar-brand {
        font-size: 25px;
      }

      .model-select select {
        max-width: 190px;
        font-size: 17px;
      }

      .messages {
        width: calc(100% - 24px);
        padding-bottom: 104px;
      }

      .composer-wrap {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 15;
        width: 100%;
        margin: 0;
        padding: 8px 10px calc(10px + env(safe-area-inset-bottom, 0px));
        background: var(--bg);
        border-top: 1px solid var(--line);
      }

      .message,
      .message.user {
        grid-template-columns: 32px minmax(0, 1fr);
      }

      .message.user .message-avatar {
        grid-column: 1;
      }

      .message.user .bubble {
        grid-column: 2;
        justify-self: start;
      }

    function bindEvents() {
      els.openSidebar.addEventListener("click", openSidebar);
      els.closeSidebar.addEventListener("click", closeSidebar);

      els.newChatButton.addEventListener("click", () => {

        saveState();
        updateTimeGreeting();
        renderSuggestions();
        render();
        closeSidebar();
        els.welcomeInput.focus();
      });
      els.searchInput.addEventListener("input", renderChatList);
      els.modelSelect.addEventListener("change", () => {
        state.model = els.modelSelect.value;
        saveState();
        updateAccountModelLabel();
      });

      const openAccount = () => openAccountModal();
      els.accountTrigger.addEventListener("click", openAccount);
      els.accountTrigger.addEventListener("keydown", (event) => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          openAccount();
        }
      });
      els.accountButton.addEventListener("click", (event) => {
        event.stopPropagation();
        openAccount();
      });
      els.closeAccountModal.addEventListener("click", closeAccountModal);
      els.accountModal.addEventListener("click", (event) => {
        if (event.target === els.accountModal) closeAccountModal();
      });
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && !els.accountModal.hidden) closeAccountModal();
      });

        state.userName = els.accountNameInput.value.trim().slice(0, 24);
        saveState();
        updateAccountDisplay();
      });

        if (!state.chats.length) return;
        const confirmed = window.confirm("Delete all chats? This can't be undone.");

        state.chats = [];
        state.activeId = null;
        createChat();
        saveState();
        render();
        closeAccountModal();
      });
      els.stopButton.addEventListener("click", () => {
        if (streamController) streamController.abort();
      });

      setupFileAttach("welcome", els.welcomeAttach, els.welcomeFileInput, els.welcomeFileChip, els.welcomeFileChipName, els.welcomeFileChipRemove);
      setupFileAttach("chat", els.chatAttach, els.chatFileInput, els.chatFileChip, els.chatFileChipName, els.chatFileChipRemove);

      els.welcomeForm.addEventListener("submit", (event) => {
        event.preventDefault();

      });
      els.chatForm.addEventListener("submit", (event) => {
        event.preventDefault();

      [els.welcomeInput, els.chatInput].forEach((input) => {

    function updateTimeGreeting() {
      const hour = new Date().getHours();

      // Each bucket holds a few lines; one is picked at random so the
      // greeting feels a little different on reload without changing meaning.
      const buckets = [
        {
          from: 5,
          to: 12,
          lines: [
            { title: "Good morning!", subtitle: "Start fresh. What should we make today?" },
            { title: "Good morning!", subtitle: "Coffee first, ideas second. I'm ready when you are." },
            { title: "Rise and shine!", subtitle: "A brand new day for a brand new idea." }
          ]
        },
        {
          from: 12,
          to: 17,
          lines: [
            { title: "Good afternoon!", subtitle: "A clear idea can turn the whole day around." },
            { title: "Good afternoon!", subtitle: "Midday slump? Let's fix that with something interesting." },
            { title: "Good afternoon!", subtitle: "Halfway through the day - what's on your mind?" }
          ]
        },
        {
          from: 17,
          to: 21,
          lines: [
            { title: "Good evening!", subtitle: "Ready when you are. Let's shape the next idea." },
            { title: "Good evening!", subtitle: "Winding down or just getting started? Either works." },
            { title: "Good evening!", subtitle: "The evening's yours - what should we work on?" }
          ]
        },
        {
          from: 21,
          to: 25, // wraps past midnight to 1am
          lines: [
            { title: "Hello, night owl \u{1F319}", subtitle: "The world's quiet now - perfect for deep work." },
            { title: "Hello, night owl \u{1F319}", subtitle: "Burning the midnight oil? I'm right here with you." },
            { title: "Hello, night owl \u{1F319}", subtitle: "Late hours, clear thoughts. What's on your mind?" }
          ]
        },
        {
          from: 1,
          to: 5,
          lines: [
            { title: "Still up?", subtitle: "3am creativity is the best creativity." },
            { title: "Still up?", subtitle: "No judgment here - let's make these hours count." },
            { title: "Whoa, it's late.", subtitle: "Either an emergency or a great idea. Let's hear it." }
          ]
        }
      ];

      // Normalize hour so 0 (midnight) is treated as 24 for the night-owl bucket.
      const normalizedHour = hour === 0 ? 24 : hour;

      const bucket =
        buckets.find((item) => normalizedHour >= item.from && normalizedHour < item.to) ||
        buckets[0];

      const greeting = bucket.lines[Math.floor(Math.random() * bucket.lines.length)];

      els.welcomeTitle.textContent = greeting.title;
      els.welcomeSubtitle.textContent = greeting.subtitle;
    }

    async function sendMessage(rawText, sourceKey) {
      const text = rawText.trim();
      const attachment = sourceKey ? attachedFiles[sourceKey] : null;
      if ((!text && !attachment) || streamController) return;

      if (window.location.protocol === "file:") {
        alert("Chat replies need the backend server. Run npm start in VS Code, then open http://localhost:5110");
        return;
      }

      const chat = activeChat();
      const displayText = text || `Sent a file: ${attachment?.name || "attachment"}`;
      chat.messages.push({
        id: uid(),
        role: "user",
        content: displayText,
        apiContent: buildApiContent(text, attachment),
        attachment: attachment ? { name: attachment.name, type: attachment.type, size: attachment.size } : null,
        createdAt: new Date().toISOString()
      });
      chat.title = chat.title === "New chat" ? makeTitle(displayText) : chat.title;
      chat.updatedAt = new Date().toISOString();

      const assistantMessage = {
        id: uid(),
        role: "assistant",
        content: "",
        pending: true,
        createdAt: new Date().toISOString()
      };
      chat.messages.push(assistantMessage);

      els.welcomeInput.value = "";
      els.chatInput.value = "";
      resizeTextarea(els.welcomeInput);
      resizeTextarea(els.chatInput);
      if (sourceKey) clearAttachedFile(sourceKey);
      setStreaming(true);
      saveState();
      render();

      streamController = new AbortController();

      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            model: state.model || DEFAULT_MODEL,
            messages: chat.messages
              .filter((message) => message.role === "user" || message.role === "assistant")
              .filter((message) => message.id !== assistantMessage.id)
              .map((message) => ({ role: message.role, content: message.apiContent || message.content })),
            temperature: 0.6,
            maxTokens: 700,
            reasoningEffort: "low",
            enableSearch: false,
            systemPrompt: DEFAULT_SYSTEM_PROMPT
          }),
          signal: streamController.signal
        });

        if (!response.ok) {
          throw new Error(await friendlyError(response));
        }

        const reader = response.body.getReader();
        const decoder = new TextDecoder();

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          assistantMessage.pending = false;
          assistantMessage.content += decoder.decode(value, { stream: true });
          updateStreamingMessage(assistantMessage);
        }

        assistantMessage.pending = false;
        assistantMessage.content = assistantMessage.content.trim() || "I did not receive a text response.";
      } catch (error) {
        assistantMessage.pending = false;
        if (error.name === "AbortError") {
          assistantMessage.content = assistantMessage.content || "Stopped.";
        } else {
          assistantMessage.content =
            error instanceof Error ? error.message : "The chat service could not complete the request.";
        }
      } finally {
        streamController = null;
        setStreaming(false);
        chat.updatedAt = new Date().toISOString();
        saveState();
        render();
      }
    }

    function render() {
      els.modelSelect.value = state.model || DEFAULT_MODEL;

      updateSendButtons();

        const empty = document.createElement("div");
        empty.className = "empty-recent";
        empty.textContent = "No matching chats yet.";
        els.chatList.append(empty);
        return;

      chats.forEach((chat) => {

        row.className = `chat-row${chat.id === state.activeId ? " active" : ""}`;
        row.type = "button";
        row.innerHTML = `
            <span class="icon" aria-hidden="true">

              </svg>
            </span>

          if (event.target.closest(".delete-chat")) {
            event.stopPropagation();

            return;
          }
          state.activeId = chat.id;
          saveState();
          render();
          closeSidebar();
        });
        els.chatList.append(row);

    function setupFileAttach(sourceKey, attachButton, fileInput, chipEl, chipNameEl, chipRemoveButton) {
      attachButton.addEventListener("click", () => fileInput.click());

      fileInput.addEventListener("change", async () => {
        const file = fileInput.files?.[0];
        fileInput.value = ""; // allow re-selecting the same file later
        if (!file) return;

        if (file.size > MAX_ATTACHMENT_BYTES) {
          alert(`"${file.name}" is too large. Please attach a file under ${formatFileSize(MAX_ATTACHMENT_BYTES)}.`);
          return;
        }

        const isText = file.type.startsWith("text/") || TEXT_FILE_EXTENSIONS.test(file.name);
        let textContent = null;

        if (isText) {
          try {
            textContent = (await file.text()).slice(0, 20000);
          } catch {
            textContent = null;
          }
        }

        attachedFiles[sourceKey] = {
          name: file.name,
          type: file.type || "unknown",
          size: file.size,
          isText,
          textContent
        };

        chipNameEl.textContent = `${file.name} (${formatFileSize(file.size)})`;
        chipEl.hidden = false;
        updateSendButtons();
      });

      chipRemoveButton.addEventListener("click", () => clearAttachedFile(sourceKey));
    }

    function clearAttachedFile(sourceKey) {
      attachedFiles[sourceKey] = null;
      const chipEl = sourceKey === "welcome" ? els.welcomeFileChip : els.chatFileChip;
      chipEl.hidden = true;
      updateSendButtons();
    }

    function buildApiContent(text, attachment) {
      if (!attachment) return text;

      const header = `[Attached file: ${attachment.name} (${attachment.type}, ${formatFileSize(attachment.size)})]`;
      const body = attachment.isText && attachment.textContent
        ? `\n---\n${attachment.textContent}\n---`
        : "\n(This file's contents cannot be read by this assistant - it can only read plain text files. Only the file name and type are visible.)";

      return `${text ? `${text}\n\n` : ""}${header}${body}`;
    }

    function formatFileSize(bytes) {
      if (bytes < 1024) return `${bytes} B`;
      if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
      return `${(bytes / (1024 * 1024)).toFixed(1)} MB`;
    }

    function updateStreamingMessage(message) {
      const node = document.querySelector(`[data-message-id="${message.id}"] .bubble`);
      if (!node) return;
      node.innerHTML = message.pending ? typingMarkup() : formatMessage(message.content);
      els.messages.scrollTop = els.messages.scrollHeight;
    }

    function setStreaming(isStreaming) {
      els.welcomeInput.disabled = isStreaming;
      els.chatInput.disabled = isStreaming;
      els.welcomeMic.disabled = isStreaming;
      els.chatMic.disabled = isStreaming;
      els.stopButton.disabled = !isStreaming;
      updateSendButtons();
    }

    function toggleVoiceInput(input, button) {
      if (!SpeechRecognition) {
        alert("Voice typing is not supported in this browser. Please use Chrome, Edge, or another browser with speech recognition.");
        return;
      }

      if (recognition) {
        recognition.stop();
        return;
      }

      recognition = new SpeechRecognition();
      recognition.lang = "en-US";
      recognition.interimResults = true;
      recognition.continuous = false;
      activeVoiceInput = input;
      button.classList.add("listening");

      let finalTranscript = "";
      recognition.onresult = (event) => {
        let interimTranscript = "";
        for (let index = event.resultIndex; index < event.results.length; index += 1) {
          const transcript = event.results[index][0].transcript;
          if (event.results[index].isFinal) {
            finalTranscript += transcript;
          } else {
            interimTranscript += transcript;
          }
        }

        const baseText = input.dataset.voiceBase ?? input.value;
        const spokenText = `${finalTranscript} ${interimTranscript}`.trim();
        input.value = [baseText, spokenText].filter(Boolean).join(" ").trim();
        resizeTextarea(input);
        updateSendButtons();
      };

      recognition.onstart = () => {
        input.dataset.voiceBase = input.value.trim();
      };

      recognition.onerror = () => {
        cleanupVoiceInput();
      };

      recognition.onend = () => {
        cleanupVoiceInput();
        input.focus();
      };

      recognition.start();
    }

    function cleanupVoiceInput() {
      recognition = null;
      activeVoiceInput?.removeAttribute("data-voice-base");
      activeVoiceInput = null;
      els.welcomeMic.classList.remove("listening");
      els.chatMic.classList.remove("listening");
    }

    function speakAnswer(text, button) {
      if (!("speechSynthesis" in window)) {
        alert("Text-to-speech is not supported in this browser.");
        return;
      }

      if (speakingButton === button) {
        window.speechSynthesis.cancel();
        resetSpeakingButton();
        return;
      }

      window.speechSynthesis.cancel();
      resetSpeakingButton();

      const utterance = new SpeechSynthesisUtterance(text.replace(/```[\s\S]*?```/g, "code block omitted"));
      utterance.lang = "en-US";
      utterance.rate = 1;
      utterance.pitch = 1;
      utterance.onend = resetSpeakingButton;
      utterance.onerror = resetSpeakingButton;

      speakingButton = button;
      button.textContent = "Stop";
      button.classList.add("playing");
      window.speechSynthesis.speak(utterance);
    }

    function resetSpeakingButton() {
      if (speakingButton) {
        speakingButton.textContent = "Listen";
        speakingButton.classList.remove("playing");
      }
      speakingButton = null;
    }

    function updateSendButtons() {
      const hasWelcomeText = els.welcomeInput.value.trim().length > 0 || Boolean(attachedFiles.welcome);
      const hasChatText = els.chatInput.value.trim().length > 0 || Boolean(attachedFiles.chat);
      els.welcomeSend.classList.toggle("ready", hasWelcomeText && !streamController);
      els.chatSend.classList.toggle("ready", hasChatText && !streamController);
      els.welcomeSend.disabled = Boolean(streamController) || !hasWelcomeText;
      els.chatSend.disabled = Boolean(streamController) || !hasChatText;
    }

    function closeSidebar() {
      document.body.classList.remove("sidebar-open");
    }

    function openAccountModal() {
      els.accountNameInput.value = state.userName || "";
      updateAccountModelLabel();
      els.accountModal.hidden = false;
      els.accountNameInput.focus();
    }

    function closeAccountModal() {
      els.accountModal.hidden = true;
    }

    function updateAccountDisplay() {
      const name = state.userName.trim();
      els.accountNameLabel.textContent = name || "Your account";
      els.accountAvatar.textContent = name ? name.trim()[0].toUpperCase() : "F";
    }

    function updateAccountModelLabel() {
      const selectedOption = els.modelSelect.options[els.modelSelect.selectedIndex];
      els.accountModelLabel.textContent = selectedOption ? selectedOption.textContent : state.model;
    }

    function createChat() {
      const now = new Date().toISOString();
      const chat = {
        id: uid(),
        title: "New chat",
        createdAt: now,
        updatedAt: now,
        messages: []
      };
      state.chats.unshift(chat);
      state.activeId = chat.id;
    }

    function deleteChat(id) {
      state.chats = state.chats.filter((chat) => chat.id !== id);
      if (state.chats.length === 0) createChat();
      if (state.activeId === id) state.activeId = state.chats[0].id;
      saveState();
      render();
    }

    function ensureActiveChat() {
      if (!state.chats.length) createChat();
      if (!state.chats.some((chat) => chat.id === state.activeId)) {
        state.activeId = state.chats[0].id;
      }
    }

    function activeChat() {
      return state.chats.find((chat) => chat.id === state.activeId) || state.chats[0];
    }

    function loadState() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
        return {
          chats: Array.isArray(saved.chats) ? saved.chats : [],
          activeId: saved.activeId || null,
          model: saved.model || DEFAULT_MODEL,
          userName: typeof saved.userName === "string" ? saved.userName : ""
        };
      } catch {
        return {
          chats: [],
          activeId: null,
          model: DEFAULT_MODEL,
          userName: ""
        };
      }
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function resizeTextarea(textarea) {
      textarea.style.height = "auto";
      textarea.style.height = `${Math.min(textarea.scrollHeight, 180)}px`;
    }

    function makeTitle(text) {
      const clean = text.replace(/\s+/g, " ").trim();
      return clean.length > 44 ? `${clean.slice(0, 44)}...` : clean || "New chat";
    }

    async function friendlyError(response) {
      try {
        const data = await response.json();
        const detail = `${data.error || ""} ${data.detail || ""}`.toLowerCase();
        if (detail.includes("groq_api_key") || detail.includes("api key")) {
          return "The chat service is not connected yet. Please check the backend .env file.";
        }
        return [data.error, data.detail].filter(Boolean).join(": ") || "The chat service failed.";
      } catch {
        return "The chat service failed.";
      }
    }

    function typingMarkup() {
      return '<span class="typing"><span></span><span></span><span></span></span>';
    }

    function formatMessage(raw) {
      const text = raw || "";
      const fencePattern = /```([a-zA-Z0-9_-]+)?\n?([\s\S]*?)```/g;
      let html = "";
      let cursor = 0;
      let match;

      while ((match = fencePattern.exec(text)) !== null) {
        html += formatPlainText(text.slice(cursor, match.index));
        html += `<pre><code>${escapeHtml(match[2].trim())}</code></pre>`;
        cursor = match.index + match[0].length;
      }

      html += formatPlainText(text.slice(cursor));
      return html;
    }

    function formatPlainText(text) {
      return escapeHtml(text)
        .replace(/`([^`]+)`/g, "<code>$1</code>")
        .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
        .split(/\n{2,}/)
        .filter(Boolean)
        .map((paragraph) => `<p>${paragraph.replace(/\n/g, "<br>")}</p>`)
        .join("");
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function uid() {
      return crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random().toString(16).slice(2)}`;
    }
  </script>
</body>
